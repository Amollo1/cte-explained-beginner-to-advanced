name: Test SQL solutions

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cte_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cte_lab
    steps:
      - uses: actions/checkout@v4
      - name: Load practice data
        run: psql -v ON_ERROR_STOP=1 -q -f data/schema_and_data.sql
      - name: Run examples and check solutions
        run: ./scripts/run_all.sh
